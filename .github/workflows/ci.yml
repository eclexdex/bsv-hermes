name: offline-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/update_manifest.py --check
      - run: python -m pip install build "setuptools>=77"
      - run: python -m build
      - name: Clean wheel install and exercise outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/bsv-clean"
          "$RUNNER_TEMP/bsv-clean/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bsv-clean/bin/python" -c 'import json; from bsv_hermes.adapter import capabilities, plan_commitment; assert json.loads(capabilities({}))["ok"]; assert json.loads(plan_commitment({"text":""}))["result"]["size_bytes"] == 35'
