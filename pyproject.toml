[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bsv-hermes"
version = "0.3.0rc1"
description = "Offline BSV evidence tools with separately approved mainnet digest publication for Hermes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license-files = []

[project.optional-dependencies]
mainnet = ["bsv-sdk==2.4.0", "cryptography==48.0.0"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["bsv_hermes", "bsv_hermes.*"]
namespaces = false

[tool.setuptools.package-data]
bsv_hermes = ["skills/*/SKILL.md", "mainnet/resources/*.md", "mainnet/resources/*.txt"]
