[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bsv-hermes"
version = "0.2.0"
description = "Custody-free offline evidence tools and opt-in kits for Hermes Agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license-files = []

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["bsv_hermes", "bsv_hermes.*"]
namespaces = false

[tool.setuptools.package-data]
bsv_hermes = ["skills/*/SKILL.md"]
