name: bsv-hermes
version: "0.3.0rc1"
description: "Offline evidence defaults; opt-in, separately authorized mainnet digest publication."
# Default surface. Optional tools are selected through enabled_kits, not separate plugins.
provides_tools:
  - bsv_capabilities
  - bsv_inspect_transaction
  - bsv_inspect_script
  - bsv_plan_commitment
  - bsv_identity_soul
  - bsv_assurance_artifact
provides_hooks: []
requires_env: []
capabilities: []
config_schema:
  enabled_kits:
    type: array
    default: []
    description: "Explicit groups: identity, assurance, integrations, mainnet. No group is enabled by default."
  mainnet_directory:
    type: string
    default: ""
    description: "Operator-bound absolute dedicated runtime directory; never a tool argument."
  mainnet_python:
    type: string
    default: ""
    description: "Operator-bound absolute Python executable in the isolated pinned mainnet environment."
